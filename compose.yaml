# Entorno local completo en contenedores (no requiere Node.js ni PostgreSQL en el host). Uso:
#   docker compose up web                        -> PostgreSQL + migraciones + build de producción en http://localhost:3000 (para usarla)
#   docker compose up app                        -> PostgreSQL + migraciones + servidor de desarrollo en http://localhost:3001 (para programar)
#   docker compose run --rm app pnpm <script>    -> typecheck, lint, test, build, etc.
#   docker compose --profile e2e run --rm e2e    -> E2E con Playwright contra un build de producción y una base efímera
name: engineering-academy

# Variables comunes. Las opcionales se toman de un archivo `.env` local (ignorado por git) o del entorno.
x-app-env:
  &app-env # Los eventos de archivos no atraviesan de forma confiable el bind mount desde Windows: se usa polling.
  WATCHPACK_POLLING: "true"
  CHOKIDAR_USEPOLLING: "true"
  # Proveedor LLM real opcional (AI Agents Lab y AI Study Mentor). Vacíos: proveedor local determinista.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_JUDGE_MODEL: ${AI_JUDGE_MODEL:-}
  AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-}
  AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-}
  # Autenticación (Fase 6). GitHub es opcional; sin él, se usa email y contraseña.
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  ADMIN_GITHUB_LOGINS: ${ADMIN_GITHUB_LOGINS:-}
  AUTH_ALLOW_SIGNUP: ${AUTH_ALLOW_SIGNUP:-}
  AUTH_MAX_ATTEMPTS: ${AUTH_MAX_ATTEMPTS:-}

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: engineering-academy-dev:local
  working_dir: /app

services:
  # PostgreSQL local para desarrollo: los datos persisten en el volumen `pgdata`. Se expone sólo en 127.0.0.1:55432
  # para inspeccionarla con un cliente propio, sin chocar con un PostgreSQL instalado en el puerto 5432.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eal
      POSTGRES_PASSWORD: eal
      POSTGRES_DB: eal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eal -d eal"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Para USAR la app: build de producción (páginas prerenderizadas, JS minificado). Recompila sólo si hubo cambios.
  web:
    <<: *app-base
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL:-postgres://eal:eal@db:5432/eal}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_prod:/app/.next
    command: sh scripts/serve-production.sh
    ports:
      - "3000:3000"

  # Para PROGRAMAR: servidor de desarrollo con recarga en caliente. Compila cada página al visitarla, por eso es
  # mucho más lento que `web`; no es representativo de la performance real.
  app:
    <<: *app-base
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL:-postgres://eal:eal@db:5432/eal}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # node_modules y la caché de Next viven en volúmenes Linux: evita mezclar binarios nativos
      # de Windows y Linux, y acelera la E/S frente al bind mount.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "pnpm install --frozen-lockfile && pnpm db:migrate && pnpm dev:docker"
    ports:
      - "3001:3000"

  # Base efímera para E2E (en memoria): cada `docker compose --profile e2e down` la descarta.
  db-e2e:
    image: postgres:17-alpine
    profiles: ["e2e"]
    environment:
      POSTGRES_USER: eal
      POSTGRES_PASSWORD: eal
      POSTGRES_DB: eal
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eal -d eal"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Build de producción aislado para E2E: usa su propio volumen .next para no pisar el de desarrollo.
  web-e2e:
    <<: *app-base
    profiles: ["e2e"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://eal:eal@db-e2e:5432/eal
      ADMIN_EMAILS: admin@e2e.test
      AUTH_ALLOW_SIGNUP: "true"
      # Las pruebas registran muchas cuentas desde la misma IP: más margen que el límite real (10 cada 15 min).
      AUTH_MAX_ATTEMPTS: "500"
    depends_on:
      db-e2e:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_e2e:/app/.next
    command: sh -c "pnpm install --frozen-lockfile && pnpm db:migrate && pnpm build && pnpm start --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    depends_on:
      web-e2e:
        condition: service_healthy
    # Comparte la red del servidor: la app se abre en http://localhost:3000, que el navegador considera un contexto
    # seguro (necesario para crypto.subtle, usado por Sandpack), igual que en el uso local real.
    network_mode: "service:web-e2e"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      E2E_BASE_URL: http://localhost:3000
      CI: "true"
    command: sh -c "npx --no-install playwright test"

volumes:
  node_modules:
  next_cache:
  next_e2e:
  next_prod:
  pgdata:
