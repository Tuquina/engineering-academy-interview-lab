# Entorno local completo en contenedores (no requiere Node.js en el host). Uso:
#   docker compose up app                        -> servidor de desarrollo en http://localhost:3000
#   docker compose run --rm app pnpm <script>    -> typecheck, lint, test, build, etc.
#   docker compose --profile e2e run --rm e2e    -> E2E con Playwright contra un build de producción
name: engineering-academy

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: engineering-academy-dev:local
  working_dir: /app
  environment:
    # Los eventos de archivos no atraviesan de forma confiable el bind mount desde Windows: se usa polling.
    WATCHPACK_POLLING: "true"
    CHOKIDAR_USEPOLLING: "true"

services:
  app:
    <<: *app-base
    volumes:
      - .:/app
      # node_modules y la caché de Next viven en volúmenes Linux: evita mezclar binarios nativos
      # de Windows y Linux, y acelera la E/S frente al bind mount.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev:docker"
    ports:
      - "3000:3000"

  # Build de producción aislado para E2E: usa su propio volumen .next para no pisar el de desarrollo.
  web-e2e:
    <<: *app-base
    profiles: ["e2e"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_e2e:/app/.next
    command: sh -c "pnpm install --frozen-lockfile && pnpm build && pnpm start --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /app
    depends_on:
      web-e2e:
        condition: service_healthy
    # Comparte la red del servidor: la app se abre en http://localhost:3000, que el navegador considera un contexto
    # seguro (necesario para crypto.subtle, usado por Sandpack), igual que en el uso local real.
    network_mode: "service:web-e2e"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      E2E_BASE_URL: http://localhost:3000
      CI: "true"
    command: sh -c "npx --no-install playwright test"

volumes:
  node_modules:
  next_cache:
  next_e2e:
