minimumReleaseAgeExclude:
  - lucide-react@1.75.0
  - "@vitest/mocker@5.1.1"
  - "@vitest/spy@5.1.1"
  - vitest@5.1.1
  - recharts@3.11.0
allowBuilds:
  # Su script de postinstall sólo imprime un mensaje; no es necesario para funcionar.
  es5-ext: false
  # drizzle-kit (generación de migraciones) usa esbuild; su postinstall verifica el binario de la plataforma.
  esbuild: true
